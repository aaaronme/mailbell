name: Release

# Push a tag like v1.0.0 (matching package.json's version) to build both
# stores' zips and attach them to a GitHub release; "Publish to stores"
# then submits them to AMO and the Chrome Web Store (docs/RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm compile
      - run: pnpm test
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The built-in OAuth client (docs/RELEASING.md); unset, the release asks
      # every user for their own.
      - run: pnpm zip
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}
          WXT_GOOGLE_CLIENT_SECRET: ${{ secrets.WXT_GOOGLE_CLIENT_SECRET }}
      - run: pnpm zip:firefox
        env:
          WXT_GOOGLE_CLIENT_ID: ${{ secrets.WXT_GOOGLE_CLIENT_ID }}
          WXT_GOOGLE_CLIENT_SECRET: ${{ secrets.WXT_GOOGLE_CLIENT_SECRET }}
      - run: gh release create "$GITHUB_REF_NAME" .output/*.zip --title "Mailbell $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
