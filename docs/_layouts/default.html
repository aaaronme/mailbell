<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {% seo %}
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap"
    />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
    {% if page.schema %}<script type="application/ld+json">{{ page.schema | jsonify }}</script>{% endif %}
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="24" height="24" />
          Mailbell
        </a>
        <nav>
          {% for item in site.data.nav %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main>
      <div class="wrap">{{ content }}</div>
    </main>
    <footer class="site">
      <div class="wrap">
        <span>Mailbell is free and open source (GPL-3.0).</span>
        <a href="{{ site.github_url }}">GitHub</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy policy</a>
        <a href="{{ site.github_url }}/issues">Support</a>
      </div>
    </footer>
  </body>
</html>
