<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#00111b" media="(prefers-color-scheme: dark)" />
    {% seo %}
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
    {% if page.schema %}<script type="application/ld+json">{{ page.schema | jsonify }}</script>{% endif %}
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/icon.png' | relative_url }}" alt="" width="24" height="24" />
          Mailbell
        </a>
        <nav>
          {% for item in site.data.nav %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main>
      <div class="wrap{% if page.path contains '.md' %} prose{% endif %}">{{ content }}</div>
    </main>
    <footer class="site">
      <div class="wrap">
        <span>Free and open source, GPL-3.0</span>
        <a href="{{ site.github_url }}">GitHub</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="{{ site.github_url }}/issues">Support</a>
      </div>
    </footer>
  </body>
</html>
